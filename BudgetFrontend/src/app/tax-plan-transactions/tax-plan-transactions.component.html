<div class="container">
    <div class="header">
        <h2>Transactions</h2>
        <button mat-raised-button color="primary" (click)="openAddTaxPlanTransactionDialog()">Add Transaction</button>
    </div>
<table mat-table [dataSource]="taxplanTransactions" class="mat-elevation-z2">
    <ng-container matColumnDef="transactionAmount">
      <th mat-header-cell *matHeaderCellDef> Transaction Amount </th>
      <td mat-cell *matCellDef="let transaction"> ₹{{transaction.transactionAmount}} </td>
    </ng-container>

    <ng-container matColumnDef="transactionDate">
      <th mat-header-cell *matHeaderCellDef> Transaction Date </th>
      <td mat-cell *matCellDef="let transaction"> {{transaction.transactionDate | date}} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let transaction; let i = index">
        <button mat-icon-button color="accent" (click)="openAddTaxPlanTransactionDialog(transaction, i)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deletePlanTransaction(transaction.taxPlanTransactionId)">
           <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['transactionAmount', 'transactionDate', 'actions']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['transactionAmount', 'transactionDate', 'actions']"></tr>
  </table>
</div>
