<mat-dialog-content>
  <mat-form-field appearance="outline">
    <mat-label>Transaction Amount</mat-label>
    <input matInput [(ngModel)]="transactionAmount" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="example-form-field">
  <mat-label>Transaction Date</mat-label>
  <input matInput [matDatepicker]="datepicker"  [(ngModel)]="transactionDate"/>
  <mat-hint>MM/DD/YYYY</mat-hint>
  <mat-datepicker-toggle matIconSuffix [for]="datepicker"></mat-datepicker-toggle>
  <mat-datepicker #datepicker>
    <mat-datepicker-actions>
      <button mat-button matDatepickerCancel>Cancel</button>
      <button mat-raised-button matDatepickerApply>Apply</button>
    </mat-datepicker-actions>
  </mat-datepicker>
</mat-form-field>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button color="accent" mat-dialog-close >Cancel</button>
  <button mat-button color="primary" mat-dialog-close (click)="addTaxPlanTransaction()" cdkFocusInitial>Add Transaction</button>
</mat-dialog-actions>
